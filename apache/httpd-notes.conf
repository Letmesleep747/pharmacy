# Laptop Apache notes (5027CMD — install, configure, secure a local web server)
#
# 1. Install Apache + PHP + MySQL (XAMPP, MAMP, or Homebrew httpd/php/mysql).
# 2. Point DocumentRoot at this project folder, or copy the folder into htdocs/pharmacy.
# 3. Enable modules: rewrite, headers. AllowOverride All for this directory so .htaccess applies.
# 4. Keep PHP display_errors Off on a deployed host; On is acceptable for local development.
# 5. Do not expose phpMyAdmin to the internet. Bind MySQL to 127.0.0.1.
# 6. Create a limited DB user (see sql/schema.sql comments) instead of using root in production.
# 8. PHP mysqli needs the mysqlnd driver (default in XAMPP/MAMP) so get_result() works.
#
# Example vhost snippet:
#
# <VirtualHost *:80>
#   ServerName pharmacy.local
#   DocumentRoot "/path/to/pharmacy"
#   <Directory "/path/to/pharmacy">
#     AllowOverride All
#     Require all granted
#     Options -Indexes
#   </Directory>
# </VirtualHost>
#
# Import database:
#   mysql -u root -p < sql/schema.sql
#   mysql -u root -p < sql/seed.sql
#
# Demo logins (password for all): password
#   Customer  http://localhost/pharmacy/pages/login.php          customer@pharmacy.local
#   Staff     http://localhost/pharmacy/staff/login.php          staff@pharmacy.local
#   Admin     http://localhost/pharmacy/admin/login.php          admin@pharmacy.local
#
# JSON API examples:
#   GET /api/products?q=paracetamol
#   GET /api/products/1/availability
